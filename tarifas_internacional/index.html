  tr.innerHTML = '<td class="pais"></td>' +

    '<td class="sep">'+pr[4]+'</td><td>'+pr[5]+'</td><td>'+pr[6]+'</td><td>'+pr[7]+'</td>';
  cuerpo.appendChild(tr); return tr;
});

let loc = resolver(), norm = [];

function pintar(l) {
  loc = l;
  document.documentElement.lang = l;
  const t = UI[l], n = NOM[l];
  for (const k of ["titulo","sub1","sub2","fecha","gIva","gSin","hPais","nota1","nota2"])
    document.getElementById(k).textContent = t[k];
  const h = [t.hEst, t.hPrim, t.hResto, t.hSms, t.hEst, t.hPrim, t.hMin, t.hSms];
  h.forEach((v, i) => { document.getElementById("h" + (i+1)).textContent = v; });
  document.title = t.titulo + " - Nimbus Telecom";
  document.getElementById("buscador").placeholder = t.buscar;
  document.getElementById("vacio").textContent = t.vacio;
  n.forEach((v, i) => { filas[i].cells[0].textContent = v; });
  const orden = n.map((_, i) => i).sort((a, b) => n[a].localeCompare(n[b], l));
  orden.forEach(i => cuerpo.appendChild(filas[i]));
  norm = n.map(normalizar);
  document.querySelectorAll("#idiomas button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.loc === l)));
  filtrar(document.getElementById("buscador").value);
}

function filtrar(q) {
  const f = normalizar(q || "");
  let c = 0;
  filas.forEach((tr, i) => {
    const ok = !f || norm[i].includes(f);
    tr.style.display = ok ? "" : "none";
    if (ok) c++;
  });
  document.getElementById("vacio").style.display = c ? "none" : "block";
  const t = UI[loc];
  document.getElementById("contador").textContent = f ? c + " " + (c === 1 ? t.res1 : t.res) : "";
}

document.getElementById("idiomas").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  try { localStorage.setItem(CLAVE, b.dataset.loc); } catch (err) {}
  pintar(b.dataset.loc);
});
document.getElementById("buscador").addEventListener("input", e => filtrar(e.target.value));
pintar(loc);
</script>
