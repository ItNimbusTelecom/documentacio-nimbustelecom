const CLAVE = "nimbus-locale";
const IDIOMAS = ["ca","es","en"];

function guardado() { try { const v = localStorage.getItem(CLAVE); return IDIOMAS.includes(v) ? v : null; } catch (e) { return null; } }
function delNavegador() {
  for (const x of (navigator.languages || [navigator.language || ""])) {
    const c = String(x).slice(0,2).toLowerCase(); if (IDIOMAS.includes(c)) return c;
  } return null;
}
function resolver() {
  const p = new URLSearchParams(location.search).get("lang");
  return IDIOMAS.includes(p) ? p : (guardado() || delNavegador() || "ca");
}
const normalizar = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

const tbNac = document.querySelector("#t-nac tbody");
const tbInt = document.querySelector("#t-int tbody");
const fNac = NACV.map(v => {
  const tr = document.createElement("tr");
  tr.innerHTML = '<td class="d"></td><td>' + v[0] + ' €</td><td>' + v[1] + ' €</td>';
  tbNac.appendChild(tr); return tr;
});
const fInt = INTL.map(v => {
  const tr = document.createElement("tr");
  tr.innerHTML = '<td class="d">' + v[0] + '</td><td>0</td><td>' + v[1] + '</td>';
  tbInt.appendChild(tr); return tr;
});
const normInt = INTL.map(v => normalizar(v[0]));

let loc = resolver(), normNac = [];

function pintar(l) {
  loc = l;
  document.documentElement.lang = l;
  const t = UI[l], nom = NACD[l];
  for (const k of ["titulo","sub1","sub2","fecha","h2nac","h2int","notaInt","nota1","nota2"])
    document.getElementById(k).textContent = t[k];
  document.getElementById("hDest1").textContent = t.hDest;
  document.getElementById("hDest2").textContent = t.hDest;
  document.getElementById("hEst1").textContent = t.hEst;
  document.getElementById("hEst2").textContent = t.hEst;
  document.getElementById("hMin1").textContent = t.hMin;
  document.getElementById("hMin2").textContent = t.hMinSin;
  document.title = t.titulo + " - Nimbus Telecom";
  document.getElementById("buscador").placeholder = t.buscar;
  document.getElementById("vacio").textContent = t.vacio;
  nom.forEach((n, i) => { fNac[i].cells[0].textContent = n; });
  const orden = nom.map((_, i) => i).sort((a, b) => nom[a].localeCompare(nom[b], l));
  orden.forEach(i => tbNac.appendChild(fNac[i]));
  normNac = nom.map(normalizar);
  document.querySelectorAll("#idiomas button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.loc === l)));
  filtrar(document.getElementById("buscador").value);
}

function filtrar(q) {
  const f = normalizar(q || "");
  let n = 0, a = 0, b = 0;
  fNac.forEach((tr, i) => { const ok = !f || normNac[i].includes(f); tr.style.display = ok ? "" : "none"; if (ok) a++; });
  fInt.forEach((tr, i) => { const ok = !f || normInt[i].includes(f); tr.style.display = ok ? "" : "none"; if (ok) b++; });
  n = a + b;
  document.getElementById("t-nac").parentElement.style.display = a ? "" : "none";
  document.getElementById("h2nac").style.display = a ? "" : "none";
  document.getElementById("t-int").parentElement.style.display = b ? "" : "none";
  document.getElementById("h2int").style.display = b ? "" : "none";
  document.getElementById("notaInt").style.display = b ? "" : "none";
  document.getElementById("vacio").style.display = n ? "none" : "block";
  const t = UI[loc];
  document.getElementById("contador").textContent = f ? n + " " + (n === 1 ? t.res1 : t.res) : "";
}

document.getElementById("idiomas").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  try { localStorage.setItem(CLAVE, b.dataset.loc); } catch (err) {}
  pintar(b.dataset.loc);
});
document.getElementById("buscador").addEventListener("input", e => filtrar(e.target.value));
pintar(loc);
