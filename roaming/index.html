  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

function pintar(l) {
  loc = l;
  document.documentElement.lang = l;
  const t = UI[l], nom = PAIS[l], val = VTAB[l];
  for (const k of ["titulo","sub1","sub2","fecha","hPais","hZona","hL1","hL2","hL3","hL4",
                   "hRec","hSms","hDatos","avisoT","aviso","nota1","nota2"]) {
    document.getElementById(k).textContent = t[k];
  }
  document.title = t.titulo + " - Nimbus Telecom";
  document.getElementById("buscador").placeholder = t.buscar;
  document.getElementById("vacio").textContent = t.vacio;
  DATA.forEach((d, i) => {
    const c = filas[i].cells;
    c[0].textContent = nom[d[0]];
    for (let j = 1; j < 9; j++) c[j].textContent = val[d[j]];
  });
  const orden = DATA.map((d, i) => i)
    .sort((a, b) => nom[DATA[a][0]].localeCompare(nom[DATA[b][0]], l));
  orden.forEach(i => cuerpo.appendChild(filas[i]));
  norm = nom.map(normalizar);
  document.querySelectorAll("#idiomas button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.loc === l)));
  filtrar(document.getElementById("buscador").value);
}

function filtrar(q) {
  const f = normalizar(q || "");
  let n = 0;
  DATA.forEach((d, i) => {
    const tr = filas[i];
    const ok = !f || norm[d[0]].includes(f);
    tr.style.display = ok ? "" : "none";
    if (ok) n++;
  });
  document.getElementById("vacio").style.display = n ? "none" : "block";
  const t = UI[loc];
  document.getElementById("contador").textContent =
    f ? n + " " + (n === 1 ? t.res1 : t.res) : "";
}

document.getElementById("idiomas").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  try { localStorage.setItem(CLAVE, b.dataset.loc); } catch (err) {}
  pintar(b.dataset.loc);
});
document.getElementById("buscador").addEventListener("input", e => filtrar(e.target.value));
pintar(loc);
</script>
