const CLAVE = "nimbus-locale";
const IDIOMAS = ["ca","es","en"];

function guardado() { try { const v = localStorage.getItem(CLAVE); return IDIOMAS.includes(v) ? v : null; } catch (e) { return null; } }
function delNavegador() {
  for (const x of (navigator.languages || [navigator.language || ""])) {
    const c = String(x).slice(0,2).toLowerCase(); if (IDIOMAS.includes(c)) return c;
  } return null;
}
function resolver() {
  const p = new URLSearchParams(location.search).get("lang");
  return IDIOMAS.includes(p) ? p : (guardado() || delNavegador() || "ca");
}
const normalizar = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").toLowerCase().trim();

// --- construir el DOM una sola vez ---------------------------------------
const cont = document.getElementById("bloques");
const secciones = BLOQUES.map(b => {
  const sec = document.createElement("section");
  const h2 = document.createElement("h2");
  const badge = b.b ? document.createElement("span") : null;
  if (badge) badge.className = "todos";
  const wrap = document.createElement("div"); wrap.className = "tabla-scroll";
  const tabla = document.createElement("table");
  const thead = document.createElement("thead"); const htr = document.createElement("tr");
  b.h.forEach((_, j) => {
    const th = document.createElement("th");
    if (j === 0) th.className = "num"; else if (j === 1) th.className = "serv";
    htr.appendChild(th);
  });
  thead.appendChild(htr); tabla.appendChild(thead);
  const tbody = document.createElement("tbody");
  const filas = b.r.map(() => {
    const tr = document.createElement("tr");
    b.h.forEach((_, j) => {
      const td = document.createElement("td");
      if (j === 0) td.className = "num"; else if (j === 1) td.className = "serv";
      tr.appendChild(td);
    });
    tbody.appendChild(tr); return tr;
  });
  tabla.appendChild(tbody); wrap.appendChild(tabla);
  sec.appendChild(h2); if (badge) sec.appendChild(badge); sec.appendChild(wrap);
  cont.appendChild(sec);
  return { sec, h2, badge, ths: htr.children, filas };
});

let loc = resolver(), claves = [];

function pintar(l) {
  loc = l;
  document.documentElement.lang = l;
  const t = UI[l], S = TAB[l];
  for (const k of ["titulo","sub1","sub2","fecha","nota1","nota2"])
    document.getElementById(k).textContent = t[k];
  document.title = t.titulo + " - Nimbus Telecom";
  document.getElementById("buscador").placeholder = t.buscar;
  document.getElementById("vacio").textContent = t.vacio;
  claves = [];
  BLOQUES.forEach((b, i) => {
    const s = secciones[i];
    s.h2.innerHTML = S[b.t];
    if (s.badge) s.badge.textContent = t.todos;
    b.h.forEach((id, j) => { s.ths[j].innerHTML = S[id]; });
    const ck = [];
    b.r.forEach((fila, k) => {
      const c = s.filas[k].cells;
      fila.forEach((id, j) => { c[j].innerHTML = S[id]; });
      ck.push(normalizar(c[0].textContent + " " + c[1].textContent));
    });
    claves.push(ck);
  });
  document.querySelectorAll("#idiomas button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.loc === l)));
  filtrar(document.getElementById("buscador").value);
}

function filtrar(q) {
  const f = normalizar(q || ""), fc = f.replace(/ /g,"");
  let n = 0;
  secciones.forEach((s, i) => {
    let vis = 0;
    s.filas.forEach((tr, k) => {
      const kk = claves[i][k];
      const ok = !f || kk.includes(f) || kk.replace(/ /g,"").includes(fc);
      tr.style.display = ok ? "" : "none";
      tr.classList.toggle("hit", !!f && ok);
      if (ok) vis++;
    });
    s.sec.style.display = vis ? "" : "none";
    n += vis;
  });
  document.getElementById("vacio").style.display = n ? "none" : "block";
  const t = UI[loc];
  document.getElementById("contador").textContent = f ? n + " " + (n === 1 ? t.res1 : t.res) : "";
}

document.getElementById("idiomas").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  try { localStorage.setItem(CLAVE, b.dataset.loc); } catch (err) {}
  pintar(b.dataset.loc);
});
document.getElementById("buscador").addEventListener("input", e => filtrar(e.target.value));
pintar(loc);
